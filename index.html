<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Hari Guru Nasional 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#6ec6ff; --sky-bottom:#d9f1ff; --ink:#1b2a41; --cloud:#ffffff;
  --board:#2f4f3a; --board-edge:#8a5a33; --board-ink:#f5f7ef; --chalk:#ffe27a;
  --grass:#5fb04a; --dirt:#8a5a33; --dirt-dark:#74492a; --card:#fffaf0;
  --skin:#e8b88a; --hair:#2b1b14; --shirt:#2456ad; --sleeve:#2f62bd; --pants:#252b3a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky-top:#0d1b3d; --sky-bottom:#2a3f7a; --ink:#e8eefc; --cloud:#46598f; --grass:#3f8a3a; --dirt:#6e4626; --dirt-dark:#5a381e; --card:#e9e2d0; }
}
:root[data-theme="dark"]{ --sky-top:#0d1b3d; --sky-bottom:#2a3f7a; --ink:#e8eefc; --cloud:#46598f; --grass:#3f8a3a; --dirt:#6e4626; --dirt-dark:#5a381e; --card:#e9e2d0; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--sky-top) 50%,var(--dirt) 50%)}
body{margin:0;min-height:100%;overflow-x:hidden;position:relative;display:flex;flex-direction:column;align-items:center;
  font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--sky-top),var(--sky-bottom) 75%)}

/* langit */
.cloud{position:absolute;left:0;width:90px;height:24px;background:var(--cloud);border-radius:8px;opacity:.9;animation:drift 50s linear infinite}
.cloud::before{content:"";position:absolute;left:18px;top:-16px;width:46px;height:22px;background:inherit;border-radius:8px}
.c1{top:60px}.c2{top:150px;animation-duration:70s;animation-delay:-30s;transform:scale(.7)}.c3{top:300px;animation-duration:90s;animation-delay:-60s}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}

main{position:relative;z-index:1;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;padding:18px 14px 0}

/* papan tulis */
.board{max-width:min(560px,92vw);box-sizing:border-box;text-align:center;color:var(--board-ink);background:var(--board);
  border:6px solid var(--board-edge);border-radius:12px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
h1{margin:0 0 8px;font:400 clamp(.95rem,4.2vw,1.7rem)/1.6 'Press Start 2P',ui-monospace,monospace;color:var(--chalk);text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.tgl{margin:0;font-size:.9rem;opacity:.85}
#dedikasi{margin:10px 0 4px;font-weight:600;font-size:1.1rem}
#pesan{margin:0;min-height:3.2em;font-size:1rem;line-height:1.6}
#pesan::after{content:"";display:inline-block;width:.5em;height:1em;margin-left:2px;vertical-align:-2px;background:var(--chalk);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* karakter (1em = 1 "blok") */
.char{position:relative;width:18em;height:32em;margin:3.2em 0 0;font-size:clamp(7px,1.5vmin + 3.2px,11px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.char.jump{animation:jump .6s ease-out}
@keyframes jump{40%{transform:translateY(-4em)}}
.rig{position:absolute;inset:0;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.6em)}}
.char div{position:absolute}
.shadow{left:3em;top:31.2em;width:12em;height:1.6em;background:rgba(0,0,0,.25);border-radius:50%}

.leg{top:20em;width:3.9em;height:11em;background:var(--pants);border-radius:.5em .5em 0 0}
.leg.l{left:5em}.leg.r{left:9.1em}
.leg::after{content:"";position:absolute;bottom:0;left:-.3em;right:-.3em;height:2em;background:#111;border-radius:.8em .8em .3em .3em}

.body{left:5em;top:9em;width:8em;height:11.4em;background:var(--shirt);border-radius:1em 1em .6em .6em;overflow:hidden}
.belt{left:0;bottom:0;width:100%;height:1.2em;background:#111}
.neck{left:2.2em;top:0;width:3.6em;height:2.2em;background:var(--skin);clip-path:polygon(0 0,100% 0,50% 100%)}
.flap{top:0;width:2.6em;height:2.8em;background:#4678cf}
.flap.l{left:1.5em;clip-path:polygon(0 0,100% 0,100% 100%)}
.flap.r{left:3.9em;clip-path:polygon(0 0,100% 0,0 100%)}
.btn{left:3.65em;top:3.6em;width:.7em;height:.7em;border-radius:50%;background:#f2c94c;box-shadow:0 2em 0 #f2c94c,0 4em 0 #f2c94c,0 6em 0 #f2c94c}
.badge{left:5em;top:2.8em;width:2.2em;height:2.5em;background:radial-gradient(circle at 50% 40%,#ffe27a,#d6a21e);border:.2em solid #b7860f;border-radius:.5em .5em 1.2em 1.2em;box-sizing:border-box}
.tag{left:.8em;top:3em;width:4em;height:1.6em;background:#fff;color:#1b2a41;border-radius:.3em;font:600 .8em/2em 'Fredoka',sans-serif;text-align:center}

.arm{top:9.4em;width:3.6em;height:10em;background:var(--sleeve);border-radius:1.2em 1.2em .6em .6em;transform-origin:50% 1.4em;box-shadow:inset 0 0 0 .15em rgba(0,0,0,.14)}
.arm::before{content:"";position:absolute;top:.3em;left:.3em;right:.3em;height:.7em;background:#f2c94c;border-radius:.2em}
.arm::after{content:"";position:absolute;bottom:0;left:.2em;right:.2em;height:2.6em;background:var(--skin);border-radius:.4em .4em 1.2em 1.2em}
.arm.l{left:1.4em;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(126deg)}50%{transform:rotate(154deg)}}
.arm.r{left:13em;transform:rotate(38deg)}

.head{left:4em;top:0;width:10em;height:9em;background:var(--skin);border-radius:2em;box-shadow:inset 0 -.5em 0 rgba(0,0,0,.06)}
.head::before,.head::after{content:"";position:absolute;top:1.6em;width:1.5em;height:3.8em;background:var(--hair);border-radius:.6em}
.head::before{left:-.3em}.head::after{right:-.3em}
.hair{left:-.4em;top:-.7em;width:10.8em;height:4.6em;background:var(--hair);border-radius:2.4em 2.4em .6em .6em;
  clip-path:polygon(0 0,100% 0,100% 100%,88% 72%,74% 100%,58% 70%,42% 100%,26% 72%,12% 100%,0 100%)}
.eye{top:4.2em;width:1.4em;height:2em;background:#1b1b2f;border-radius:.5em;animation:blink 4s infinite}
.eye::after{content:"";position:absolute;top:.25em;left:.25em;width:.5em;height:.5em;background:#fff;border-radius:50%}
.eye.l{left:2.2em}.eye.r{left:6.4em}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cheek{top:6.1em;width:1.6em;height:.9em;background:#ff8fa3;opacity:.7;border-radius:50%}
.cheek.l{left:.9em}.cheek.r{left:7.5em}
.mouth{left:3.8em;top:6.2em;width:2.4em;height:1.2em;border-bottom:.35em solid #8a2f2f;border-radius:0 0 1.4em 1.4em}

/* buket */
.bq{left:5.6em;top:12.4em;width:8.6em;height:12.2em;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
.lf{top:4.4em;width:3em;height:1.5em;background:#3f9a4a;border-radius:0 100% 0 100%}
.lf.a{left:-.2em;transform:rotate(-20deg)}.lf.b{right:-.2em;transform:scaleX(-1) rotate(-20deg)}
.fl{width:1.6em;height:1.6em;border-radius:50%;background:#ffd84a;
  box-shadow:0 -1.2em 0 .1em var(--p),0 1.2em 0 .1em var(--p),-1.2em 0 0 .1em var(--p),1.2em 0 0 .1em var(--p)}
.fl.a{left:3.5em;top:1.6em;--p:#ff6f91}.fl.b{left:1.3em;top:3.7em;--p:#ff9a3c}.fl.c{left:5.7em;top:3.7em;--p:#b57bff}
.wrap{left:.8em;top:6em;width:7em;height:6.2em;background:linear-gradient(135deg,#ffd1dc,#ff8fb3);clip-path:polygon(0 0,100% 0,62% 100%,38% 100%)}
.bow{left:3em;top:8.6em;width:2.6em;height:1.1em;background:#ffd84a;border-radius:.4em}
.hold{left:3.5em;top:6.3em;width:2.7em;height:2.2em;background:var(--skin);border-radius:.9em}

/* tanah, kolom nama, kejutan */
.ground{width:100%;box-sizing:border-box;margin-top:0;padding:18px 14px 22px;text-align:center;border-top:16px solid var(--grass);
  background:var(--dirt) radial-gradient(var(--dirt-dark) 22%,transparent 24%) 0 0/18px 18px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
input,button{font:600 1rem 'Fredoka',system-ui,sans-serif;border-radius:8px;padding:9px 12px;border:3px solid #3d2814}
input{background:var(--card);color:#1b2a41;min-width:0;width:min(240px,60vw)}
button{background:#ffd84a;color:#3d2814;border-color:#b7860f;cursor:pointer;box-shadow:0 3px 0 #b7860f}
button:active{transform:translateY(3px);box-shadow:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hint{margin:10px 0 0;color:#fff;font-size:.9rem;text-shadow:0 1px 0 rgba(0,0,0,.4)}

.fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.petal{position:absolute;top:0;border-radius:50% 0 50% 0;opacity:.9;animation:fall linear forwards}
@keyframes fall{from{transform:translate(0,-10vh) rotate(0)}to{transform:translate(var(--dx),110vh) rotate(540deg)}}
.heart{position:absolute;color:#ff5c7a;animation:rise 1.6s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-150px) scale(1.3)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

<main>
  <section class="board">
    <h1>SELAMAT HARI<br>GURU NASIONAL</h1>
    <p class="tgl">25 November 2026</p>
    <p id="dedikasi">Untuk Bapak/Ibu Guru tercinta</p>
    <p id="pesan" aria-live="polite"></p>
  </section>

  <div class="char" id="char" role="img" aria-label="Guru berseragam KORPRI biru memegang buket bunga">
    <div class="shadow"></div>
    <div class="rig">
      <div class="leg l"></div><div class="leg r"></div>
      <div class="body">
        <div class="neck"></div><div class="flap l"></div><div class="flap r"></div>
        <div class="btn"></div><div class="badge"></div><div class="tag">GURU</div><div class="belt"></div>
      </div>
      <div class="arm l"></div>
      <div class="arm r"></div>
      <div class="bq">
        <div class="lf a"></div><div class="lf b"></div>
        <div class="fl a"></div><div class="fl b"></div><div class="fl c"></div>
        <div class="wrap"></div><div class="bow"></div><div class="hold"></div>
      </div>
      <div class="head">
        <div class="hair"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="cheek l"></div><div class="cheek r"></div>
        <div class="mouth"></div>
      </div>
    </div>
  </div>

  <div class="ground">
    <div class="tools">
      <input id="nama" type="text" maxlength="30" placeholder="Nama guru (opsional)" aria-label="Nama guru">
      <button id="ulang" type="button">Ucapkan lagi</button>
    </div>
    <p class="hint">Ketuk karakternya untuk kejutan</p>
  </div>
</main>
<div class="fx" id="fx"></div>

<script>
const pesan = [
  "Terima kasih telah menjadi cahaya yang menuntun langkah kami.",
  "Ilmu yang Anda berikan akan kami bawa seumur hidup.",
  "Semoga selalu sehat, bahagia, dan dimuliakan."
];
const el = document.getElementById("pesan");
const fx = document.getElementById("fx");
const charEl = document.getElementById("char");
let mi = 0, ci = 0, timer;

function ketik() {
  const m = pesan[mi];
  if (ci <= m.length) {
    el.textContent = m.slice(0, ci++);
    timer = setTimeout(ketik, 45);
  } else {
    timer = setTimeout(() => { mi = (mi + 1) % pesan.length; ci = 0; ketik(); }, 2800);
  }
}

function hati(x, y, n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = "♥";
    h.style.left = x + (Math.random() * 60 - 30) + "px";
    h.style.top = y + "px";
    h.style.fontSize = 14 + Math.random() * 18 + "px";
    h.style.setProperty("--dx", Math.random() * 80 - 40 + "px");
    h.style.animationDelay = i * 60 + "ms";
    fx.appendChild(h);
    setTimeout(() => h.remove(), 2400);
  }
}

function kelopak() {
  if (fx.querySelectorAll(".petal").length > 28) return;
  const p = document.createElement("span");
  const s = 7 + Math.random() * 7, dur = 6 + Math.random() * 6;
  p.className = "petal";
  p.style.cssText = "left:" + Math.random() * 100 + "%;width:" + s + "px;height:" + s * 0.8 + "px;background:" +
    ["#ff9ec0", "#ffd84a", "#ffffff", "#c9a4ff"][Math.floor(Math.random() * 4)] + ";animation-duration:" + dur + "s";
  p.style.setProperty("--dx", Math.random() * 120 - 60 + "px");
  fx.appendChild(p);
  setTimeout(() => p.remove(), dur * 1000);
}

charEl.addEventListener("click", () => {
  const r = charEl.getBoundingClientRect();
  hati(r.left + r.width / 2, r.top + r.height * 0.25, 10);
  charEl.classList.remove("jump"); void charEl.offsetWidth; charEl.classList.add("jump");
});

document.getElementById("nama").addEventListener("input", e => {
  const n = e.target.value.trim();
  document.getElementById("dedikasi").textContent = n ? "Untuk " + n : "Untuk Bapak/Ibu Guru tercinta";
});

document.getElementById("ulang").addEventListener("click", () => {
  clearTimeout(timer); mi = 0; ci = 0; ketik();
  hati(innerWidth / 2, innerHeight / 2, 12);
});

ketik();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(kelopak, 600);
</script>
</body>
</html>
